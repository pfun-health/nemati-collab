[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycardio"
version = "0.2.0"
description = "Model-based analysis of cardiorespiratory coupling (RSA, cardioventilatory coupling) in human physiology recordings."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robbie Capps" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "wfdb>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pycardio = "pycardio.cli:main"

[tool.setuptools]
packages = ["pycardio"]

[tool.setuptools.package-data]
pycardio = ["_c/*.c", "_c/*.h", "data/*/*.rng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY"]
ignore = ["E741", "B905"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
