name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (builds the C model)
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check pycardio tests && uv run ruff format --check pycardio tests
      - name: Test
        run: uv run pytest
